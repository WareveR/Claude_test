# Every pull request goes to the test copy of the app first: the family-calendar-testes Worker on
# https://calendario-testes.phinest.org, with its own database, buckets and keys
# (docs/runbooks/testes.md). Production is untouched: it still deploys from main in ci.yml.
name: Testes

on:
  pull_request:
  workflow_dispatch:

jobs:
  deploy:
    # Pull requests from forks get no secrets, so they can't deploy.
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    # One deploy at a time, and never cut off halfway through a migration.
    concurrency:
      group: testes
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The whole history, to number the version (vite.config.ts).
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The first run creates the database (EU, like production) and the buckets; later runs find them.
      - name: Find or create the test database and buckets
        run: |
          find_db() { npx wrangler d1 list --json | jq -r '.[] | select(.name == "family-calendar-testes") | .uuid'; }
          id=$(find_db)
          if [ -z "$id" ]; then
            npx wrangler d1 create family-calendar-testes --jurisdiction eu --update-config=false
            id=$(find_db)
          fi
          test -n "$id"
          sed -i "s/TESTES_DATABASE_ID/$id/" wrangler.jsonc
          for bucket in family-calendar-testes-images family-calendar-testes-backups; do
            npx wrangler r2 bucket info "$bucket" > /dev/null 2>&1 ||
              npx wrangler r2 bucket create "$bucket" --location weur
          done
      - run: npm run build
        env:
          CLOUDFLARE_ENV: testes
      # The build points wrangler at the test Worker's config, so these never reach production.
      - run: npx wrangler d1 migrations apply family-calendar-testes --remote
      - run: npx wrangler deploy
      # Only the missing ones are added, so keys and the setup code stay the same between deploys.
      # The values go straight to wrangler on stdin and are never printed.
      - name: Add missing secrets
        env:
          TESTES_SETUP_CODE: ${{ secrets.TESTES_SETUP_CODE }}
        run: |
          have=$(npx wrangler secret list --format json | jq -r '.[].name')
          missing() { ! grep -qx "$1" <<< "$have"; }
          if missing VAPID_PUBLIC_KEY || missing VAPID_PRIVATE_KEY; then
            node scripts/vapid-keys.mjs > keys.env
            grep '^VAPID_PUBLIC_KEY=' keys.env | cut -d= -f2- | tr -d '\n' | npx wrangler secret put VAPID_PUBLIC_KEY
            grep '^VAPID_PRIVATE_KEY=' keys.env | cut -d= -f2- | tr -d '\n' | npx wrangler secret put VAPID_PRIVATE_KEY
            rm keys.env
          fi
          if missing VAPID_SUBJECT; then
            printf 'mailto:calendario@phinest.org' | npx wrangler secret put VAPID_SUBJECT
          fi
          if [ -n "$TESTES_SETUP_CODE" ]; then
            if missing SETUP_CODE; then printf '%s' "$TESTES_SETUP_CODE" | npx wrangler secret put SETUP_CODE; fi
          else
            echo "::warning::No TESTES_SETUP_CODE repository secret yet, so the test copy can't be set up (docs/runbooks/testes.md)."
          fi
