# Makes a new VAPID key pair for Reminders and stores it as the production Worker's secrets
# (docs/runbooks/reminders.md). Run by hand from Actions when the keys are missing or broken.
# Devices that allowed notifications before must allow them again afterwards.
name: New VAPID keys

on: workflow_dispatch

jobs:
  rotate:
    runs-on: ubuntu-latest
    concurrency: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The values go straight from the script to wrangler on stdin and are never printed.
      - name: Store a new key pair
        run: |
          node scripts/vapid-keys.mjs > keys.env
          grep '^VAPID_PUBLIC_KEY=' keys.env | cut -d= -f2- | tr -d '\n' | npx wrangler secret put VAPID_PUBLIC_KEY
          grep '^VAPID_PRIVATE_KEY=' keys.env | cut -d= -f2- | tr -d '\n' | npx wrangler secret put VAPID_PRIVATE_KEY
          rm keys.env
