# Turns on GitHub auto-merge for Claude's pull requests (head branch `claude/...`).
# GitHub then squash-merges the PR by itself once the required `check` job from
# ci.yml is green. Drafts are skipped: a PR is enabled when it is opened
# ready for review or moved out of draft.
#
# Needs, on GitHub: "Allow auto-merge" turned on, and a branch rule on main that
# requires the `check` status. To stop auto-merging, disable this workflow in
# the Actions tab (or delete this file).
name: Auto-merge Claude PRs

on:
  pull_request:
    types: [opened, reopened, ready_for_review]

permissions:
  contents: write
  pull-requests: write

jobs:
  enable:
    if: >-
      startsWith(github.head_ref, 'claude/') &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      !github.event.pull_request.draft
    runs-on: ubuntu-latest
    steps:
      - run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          # A merge made with the default token does not start other workflows
          # (CI on main, a future deploy). An AUTOMERGE_TOKEN secret avoids that.
          GH_TOKEN: ${{ secrets.AUTOMERGE_TOKEN || github.token }}
