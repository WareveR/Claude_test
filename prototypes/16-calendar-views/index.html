<title>Family Calendar Views</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,650&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: one phone-sized frame centred on the page (landscape board for Display Mode); prototype switcher floats below it. */
:root{
  --bg:#eef0ec; --frame:#fbfbf8; --surface:#ffffff; --ink:#151a17; --muted:#56605a; --line:#cfd6cf;
  --accent:#20624a; --accent-ink:#ffffff; --weekend:#d6e6f5; --weekend-ink:#1d4f80; --holiday:#fbeee3; --holiday-ink:#9a4a16;
  --overdue:#b3261e; --chrome:#1e2420; --chrome-ink:#f4f6f2;
  --display:"Fraunces", Georgia, "Times New Roman", serif;
  --body:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1a1f1c; --frame:#252b27; --surface:#323a35; --ink:#f4f7f3; --muted:#bcc6bf; --line:#4a544d;
  --accent:#7fd6ae; --accent-ink:#0d1a14; --weekend:#28425e; --weekend-ink:#cfe4fa; --holiday:#33241a; --holiday-ink:#f0a877;
  --overdue:#ff8a80; --chrome:#e7ebe6; --chrome-ink:#121614; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1a1f1c; --frame:#252b27; --surface:#323a35; --ink:#f4f7f3; --muted:#bcc6bf; --line:#4a544d;
  --accent:#7fd6ae; --accent-ink:#0d1a14; --weekend:#28425e; --weekend-ink:#cfe4fa; --holiday:#33241a; --holiday-ink:#f0a877;
  --overdue:#ff8a80; --chrome:#e7ebe6; --chrome-ink:#121614; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:14px;padding:12px 16px 84px;}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.note{max-width:420px;margin:0 auto 10px;color:var(--muted);font-size:12px;line-height:1.4}
.note b{color:var(--ink)}
.frame{position:relative;max-width:400px;margin:0 auto;height:min(760px, calc(100vh - 150px));min-height:520px;background:var(--frame);border:1px solid var(--line);border-radius:28px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 10px 30px rgba(0,0,0,.08)}
.frame.wide{max-width:1000px;border-radius:14px}
.scroll{flex:1;overflow:auto;min-height:0}
.top{display:flex;align-items:center;gap:8px;padding:14px 16px 8px}
.top h1{font-family:var(--display);font-weight:650;font-size:22px;margin:0;flex:1;text-wrap:balance}
.iconbtn{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line);background:var(--surface);font-size:15px}
.tabs{display:flex;border-top:1px solid var(--line);background:var(--surface)}
.tabs button{flex:1;padding:10px 0 12px;font-size:12px;color:var(--muted);font-weight:600}
.tabs button[aria-current="true"]{color:var(--accent)}
.seg{display:flex;gap:4px;margin:0 16px 8px;padding:3px;border-radius:10px;background:var(--weekend)}
.seg button{flex:1;padding:6px 0;border-radius:8px;font-size:12px;font-weight:600;color:var(--muted)}
.seg button[aria-current="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.muted{color:var(--muted)}
.small{font-size:12px}
.tnum{font-variant-numeric:tabular-nums}
.fab{position:absolute;right:16px;bottom:64px;width:52px;height:52px;border-radius:50%;background:var(--accent);color:var(--accent-ink);font-size:22px;display:grid;place-items:center;box-shadow:0 6px 16px rgba(0,0,0,.2)}
.fab.mic{right:78px;width:44px;height:44px;bottom:68px;font-size:18px;background:var(--surface);color:var(--ink);border:1px solid var(--line)}
/* day headers / agenda */
.dayhead{display:flex;align-items:baseline;gap:8px;padding:12px 16px 4px;position:sticky;top:0;background:var(--frame);z-index:1}
.dayhead .d{font-family:var(--display);font-size:18px;font-weight:650}
.dayhead.today .d{color:var(--accent)}
.hol{display:inline-block;font-size:11px;font-weight:600;color:var(--holiday-ink);background:var(--holiday);padding:1px 7px;border-radius:99px}
.wx{margin-left:auto;font-size:12px;color:var(--muted);white-space:nowrap}
.wx.far{opacity:.5}
.list{display:flex;flex-direction:column;gap:6px;padding:4px 16px 8px}
.item{display:flex;gap:10px;align-items:center;width:100%;text-align:left;padding:8px 10px;border-radius:10px;background:var(--surface);border:1px solid var(--line);min-width:0}
.item .time{width:44px;flex:none;font-size:12px;color:var(--muted)}
.item .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
.item.low{opacity:.6}
.item.high .t{font-weight:700}
.stripe{width:4px;align-self:stretch;border-radius:4px;flex:none}
.task{display:flex;gap:10px;align-items:center;padding:6px 10px;border-radius:10px;border:1px dashed var(--line);width:100%;text-align:left}
.box{width:18px;height:18px;border-radius:5px;border:2px solid var(--muted);flex:none;display:grid;place-items:center;font-size:11px;line-height:1}
.task.done .t{text-decoration:line-through;color:var(--muted)}
.task.done .box{background:var(--muted);border-color:var(--muted);color:var(--frame)}
.task .t{flex:1;min-width:0}
.overdue{color:var(--overdue);font-weight:600}
.dots{display:flex;gap:2px}
.dot{width:8px;height:8px;border-radius:50%;flex:none}
.av{width:20px;height:20px;border-radius:50%;display:inline-grid;place-items:center;font-size:10px;font-weight:700;color:#fff;flex:none}
.avs{display:flex}
.avs .av+.av{margin-left:-5px;box-shadow:0 0 0 2px var(--surface)}
.empty{padding:10px 16px;color:var(--muted);font-size:12px}
.ic{display:inline-block;vertical-align:-3px;flex:none}
.tacc{margin:8px 16px 0;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.tacch{display:flex;gap:6px;align-items:center;width:100%;padding:9px 12px;font-weight:600;font-size:14px;text-align:left}
.tacch .overdue{color:var(--overdue)}
.tacch .chev{margin-left:auto;color:var(--muted);transition:transform .15s}
.tacc.open .chev{transform:rotate(180deg)}
.tacc .list{padding:0 8px 8px}
.twx{font-size:13px;font-weight:500;color:var(--muted);margin-left:8px;white-space:nowrap}
.overline{margin:8px 16px 0;padding:8px 12px;border-radius:10px;background:color-mix(in srgb,var(--overdue) 12%,transparent);color:var(--overdue);font-weight:600;font-size:13px;text-align:left;width:calc(100% - 32px)}
.hourly{display:flex;gap:6px;overflow-x:auto;padding:4px 16px 8px}
.hourly div{flex:none;text-align:center;font-size:11px;padding:6px 8px;border-radius:10px;background:var(--surface);border:1px solid var(--line);min-width:48px}
.hourly b{display:block;font-size:13px}
/* month grid */
.mgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;background:var(--line);border-block:1px solid var(--line)}
.mgrid .wd.we{background:var(--weekend);color:var(--weekend-ink)}
.mgrid .wd{background:var(--frame);text-align:center;font-size:11px;color:var(--muted);padding:4px 0;font-weight:600}
.cell{background:var(--surface);min-height:62px;padding:3px;text-align:left;display:flex;flex-direction:column;gap:2px;min-width:0;overflow:hidden}
.cell.out{opacity:.4}
.cell.we{background:var(--weekend)}
.cell.we .n{color:var(--weekend-ink)}
.cell.holi{background:var(--holiday)}
.cell .n{font-size:12px;font-weight:600;display:flex;justify-content:space-between;align-items:center}
.cell.today .n span:first-child{background:var(--accent);color:var(--accent-ink);border-radius:99px;padding:0 6px}
.cell.sel{outline:2px solid var(--accent);outline-offset:-2px}
.chip{font-size:10px;line-height:14px;padding:0 4px;border-radius:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.chip.low{opacity:.55}
.more{font-size:10px;color:var(--muted)}
/* year */
.ygrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;padding:8px 16px}
.mini h3{font-size:12px;margin:0 0 4px;font-weight:700}
.mini .g{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;font-size:9px;text-align:center}
.mini .g span{padding:1px 0;border-radius:3px}
.mini .g .hi{background:var(--accent);color:var(--accent-ink);font-weight:700}
.mini .g .hd{color:var(--holiday-ink);font-weight:700}
.mini .g .td{outline:1.5px solid var(--ink)}
.hilist{padding:0 16px 16px}
.hilist h2,.sect{font-family:var(--display);font-size:15px;margin:12px 16px 6px}
/* time grid */
.tg{position:relative;display:grid}
.tg .hours{position:relative}
.tg .hr{position:absolute;left:0;right:0;border-top:1px solid var(--line);font-size:10px;color:var(--muted);padding-left:2px}
.tg .col{position:relative;border-left:1px solid var(--line)}
.ev{position:absolute;left:2px;right:2px;border-radius:6px;padding:2px 4px;font-size:10px;line-height:12px;overflow:hidden;text-align:left}
.ev.moment{border-radius:99px;height:16px!important}
.ev.low{opacity:.55}
.now{position:absolute;left:0;right:0;border-top:2px solid var(--overdue);z-index:2}
.allrow{display:grid;gap:2px;padding:4px 0;border-bottom:1px solid var(--line)}
.colhead{text-align:center;font-size:11px;padding:4px 0;font-weight:600}
.colhead.hd,.col.hd,.hdcell{background:var(--holiday)}
.colhead.we,.col.we,.wecell{background:var(--weekend)}
.colhead.we{color:var(--weekend-ink)}
.hdchip{color:var(--holiday-ink);font-weight:600;background:transparent;border:1px solid color-mix(in srgb,var(--holiday-ink) 40%,transparent);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.colhead.today{color:var(--accent)}
/* lanes (variant C) */
.lanes{display:grid;gap:1px;background:var(--line);border-block:1px solid var(--line)}
.lanes>div{background:var(--surface);padding:4px;min-height:44px;min-width:0;display:flex;flex-direction:column;gap:2px}
.lanes .lh{background:var(--frame);font-size:11px;font-weight:700;display:flex;align-items:center;gap:4px;justify-content:center}
.lanes .rh{background:var(--frame);font-size:11px;font-weight:700;justify-content:center;align-items:flex-start}
/* sheets */
.sheetwrap{position:absolute;inset:0;background:rgba(0,0,0,.35);display:flex;align-items:flex-end;z-index:5}
.sheet{background:var(--frame);width:100%;border-radius:20px 20px 0 0;padding:16px;max-height:80%;overflow:auto;display:flex;flex-direction:column;gap:10px}
.sheet h2{font-family:var(--display);margin:0;font-size:20px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pchip{display:flex;align-items:center;gap:6px;padding:6px 10px;border-radius:99px;border:1.5px solid var(--line);font-weight:600;font-size:13px}
.pchip[aria-pressed="true"]{border-color:var(--ink);background:var(--surface)}
.switch{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-top:1px solid var(--line);width:100%;text-align:left}
.knob{width:38px;height:22px;border-radius:99px;background:var(--line);position:relative;flex:none}
.knob::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:var(--frame);transition:left .15s}
.knob.on{background:var(--accent)}
.knob.on::after{left:19px}
.btn{padding:10px 14px;border-radius:10px;background:var(--accent);color:var(--accent-ink);font-weight:700;text-align:center}
.kv{display:grid;grid-template-columns:90px 1fr;gap:6px 10px;font-size:13px}
.kv dt{color:var(--muted)}
.kv dd{margin:0}
.toast{position:absolute;left:50%;bottom:130px;transform:translateX(-50%);background:var(--chrome);color:var(--chrome-ink);padding:8px 14px;border-radius:99px;font-size:12px;z-index:6;white-space:nowrap}
/* display mode */
.board{display:grid;grid-template-columns:1.25fr 1fr .9fr;gap:18px;padding:22px;height:100%;min-height:0}
.board>section{min-width:0;display:flex;flex-direction:column;gap:10px;overflow:auto}
.clock{font-family:var(--display);font-size:64px;line-height:1;font-weight:650}
.bdate{font-size:20px;font-weight:600}
.bitem{display:flex;gap:12px;align-items:center;padding:10px 12px;border-radius:12px;background:var(--surface);border:1px solid var(--line);font-size:17px}
.bitem .time{width:58px;font-size:15px;color:var(--muted);flex:none}
.bitem .t{flex:1;min-width:0}
.bday{padding:8px 0;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:4px}
.bday .h{display:flex;gap:8px;align-items:baseline;font-weight:700;font-size:15px}
.bday .i{font-size:14px;display:flex;gap:6px;align-items:center;min-width:0}
.bday .i span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.btask{display:flex;gap:12px;align-items:center;padding:12px;border-radius:12px;border:1.5px dashed var(--line);font-size:17px;text-align:left;width:100%}
.btask .box{width:26px;height:26px;border-radius:7px}
.btask.done .t{text-decoration:line-through;color:var(--muted)}
.btask.done .box{background:var(--muted);border-color:var(--muted);color:var(--frame)}
@media (max-width:760px){.board{grid-template-columns:1fr;height:auto}.frame.wide{height:auto;min-height:0}.frame.wide .scroll{overflow:visible}}
.yp{border-collapse:separate;border-spacing:1px;font-size:10px;margin:0 16px}
.yp th{font-weight:700;color:var(--muted);padding:2px 0;min-width:20px}
.yp th.we,.yp td.we{background:var(--weekend)}
.yp th.ml{position:sticky;left:0;background:var(--frame);z-index:1;text-align:left;padding-right:6px;color:var(--ink);font-size:11px;min-width:30px}
.yp td{padding:0;height:22px;min-width:20px}
.yp td.void{background:transparent}
.yp td.void.we{background:color-mix(in srgb,var(--weekend) 45%,transparent)}
.yp td.we button{color:var(--weekend-ink);font-weight:600}
.yp th.we{color:var(--weekend-ink)}
.yp td button{width:100%;height:22px;display:grid;place-items:center;border-radius:3px;position:relative;font-size:10px}
.yp td.hd button{background:var(--holiday);color:var(--holiday-ink);font-weight:700}
.yp td.td button{outline:2px solid var(--ink);outline-offset:-2px;font-weight:700}
.yp td button i{position:absolute;bottom:2px;left:50%;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:var(--accent)}
.nowbar{display:flex;align-items:center;gap:10px;padding:10px 16px 6px;border-bottom:1px solid var(--line);background:var(--surface);font-size:13px}
.nclock{font-family:var(--display);font-size:20px;font-weight:650}
.ndate{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
[data-wx]{cursor:pointer}
.nwx{white-space:nowrap;padding:3px 8px;border-radius:99px;border:1px solid var(--line)}
.sheetwrap.center{align-items:center;padding:16px}
.sheetwrap.center .sheet{border-radius:16px}
/* prototype switcher */
.switcher{position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);display:flex;align-items:center;gap:4px;background:var(--chrome);color:var(--chrome-ink);border-radius:99px;padding:4px;box-shadow:0 8px 24px rgba(0,0,0,.3);z-index:10;max-width:calc(100% - 32px)}
.switcher button{width:36px;height:36px;border-radius:50%;font-size:18px;color:var(--chrome-ink)}
.switcher .lbl{padding:0 10px;font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

function occ(s){
  const out=[];
  for(const e of E){
    if(!vis(e))continue;
    if(e.from){
      if(e.rep&&e.rep.y){ if(s.slice(5)===e.from.slice(5)&&s>=e.from) out.push({e,ad:true,age:yr(s)-e.born}); }
      else if(e.from<=s&&s<=e.to) out.push({e,ad:true,cont:e.from!==e.to,first:s===e.from,last:s===e.to});
      continue;
    }
    const sd=e.start.slice(0,10),stt=e.start.slice(11),ed=e.end?e.end.slice(0,10):sd,et=e.end?e.end.slice(11):null;
    if(e.rep){
      if(s<sd)continue;
      const ok=e.rep.d||(e.rep.w&&e.rep.w.includes(wd(s)));
      if(ok) out.push({e,s:stt,en:et,rep:true});
    }else if(sd<=s&&s<=ed){
      if(sd!==ed) out.push({e,ad:true,span:true,label:`${short(sd)} ${stt} → ${short(ed)} ${et}`,s:s===sd?stt:null,en:s===ed?et:null});
      else out.push({e,s:stt,en:et});
    }
  }
  return out.sort((a,b)=>(a.ad?0:1)-(b.ad?0:1)||(a.s||'').localeCompare(b.s||''));
}

function taskAcc(d,to=d){
  const ts=TK.filter(t=>tvis(t)&&(t.due>=d&&t.due<=to||TODAY>=d&&TODAY<=to&&isOver(t))).filter(t=>!(d<=TODAY&&TODAY<=to&&t.done&&t.due<TODAY)).sort((a,b)=>(a.due||'').localeCompare(b.due||''));
  if(!ts.length)return '';const o=ts.filter(isOver).length;
  return `<div class="tacc ${st.tacc?'open':''}"><button class="tacch" data-toggle="tacc" aria-expanded="${!!st.tacc}"><span>Tarefas ${ts.length}</span>${o?`<span class="overdue">· ${o} atrasada${o>1?'s':''}</span>`:''}<span class="chev">${ic('chev')}</span></button>${st.tacc?`<div class="list">${ts.map(t=>taskRow(t,d!==to)).join('')}</div>`:''}</div>`;}
function hourly(){return `<div class="hourly" data-wx role="button" tabindex="0" aria-label="Previsão por hora">${HOURLY.map(h=>`<div class="tnum">${h[0]}<b>${h[1]} ${h[2]}°</b>${h[3]}% ${ic('drop',11)}</div>`).join('')}</div>`;}
function monthCells(s){const first=s.slice(0,8)+'01';const start=monday(first);const cells=[];for(let i=0;i<42;i++)cells.push(add(start,i));return cells;}
function tasksView(groupByPerson){

  if(st.showDone)groups.push(['Feitas',all.filter(t=>t.done)]);
  let h='';
  if(groupByPerson){

    }

}
function yearMinis(){
  const y=yr(st.cur);let h='<div class="ygrid">';
  for(let m=0;m<12;m++){
    const s=`${y}-${String(m+1).padStart(2,'0')}-01`;const cells=monthCells(s);
    h+=`<button class="mini" data-month="${s}"><h3>${MN[m].slice(0,3)}</h3><div class="g tnum">${WD.map(w=>`<span class="muted">${w[0]}</span>`).join('')}${cells.slice(0,cells[35].slice(0,7)===s.slice(0,7)?42:35).map(c=>{if(c.slice(0,7)!==s.slice(0,7))return '<span></span>';const hi=occ(c).some(o=>o.e.imp==='high');return `<span class="${hi?'hi':''} ${holi(c)?'hd':''} ${c===TODAY?'td':''}">${dnum(c)}</span>`;}).join('')}</div></button>`;
  }
  h+='</div>';
  const seen=new Set(),hl=[];
  for(let i=0;i<365;i++){const c=add(`${y}-01-01`,i);if(yr(c)!==y)break;for(const o of occ(c))if(o.e.imp==='high'){const k=o.e.id+(o.e.rep?c:'');if(!seen.has(k)){seen.add(k);hl.push([c,o]);}}}
  h+=`<h2 class="sect">Importantes em ${y}</h2><div class="list" style="padding-bottom:90px">${hl.map(([c,o])=>`<button class="item" data-e="${o.e.id}"><span class="time tnum">${dnum(c)} ${MN[mon(c)].slice(0,3)}</span><span>${T[o.e.ty].i}</span><span class="t">${title(o)}</span>${avs(o.e.p)}</button>`).join('')}</div>`;
  return h;
}
function lanesOf(items){ // greedy column assignment for overlapping timed items
  const cols=[];for(const o of items){const s=mins(o.s),e=o.en?mins(o.en):s+30;let k=cols.findIndex(end=>end<=s);if(k<0){k=cols.length;cols.push(e);}else cols[k]=e;o.k=k;}
  items.forEach(o=>o.n=cols.length);return items;
}
const dcls=d=>holi(d)?'hd':wd(d)>4?'we':'';
function timeGrid(days,{px=40,from=7,to=23,colKey=null,colLabels=null,enc='B'}={}){
  const cols=colKey?colLabels:days.map(d=>({key:d,label:short(d),today:d===TODAY,d}));
  const hgt=(to-from)*px;
  let head=`<div style="display:grid;grid-template-columns:34px repeat(${cols.length},1fr);position:sticky;top:0;background:var(--frame);z-index:2">
    <span></span>${cols.map(c=>`<div class="colhead ${c.today?'today':''} ${c.d?dcls(c.d):''}">${c.label}${c.d&&wx(c.d)?`<div class="small muted">${wx(c.d).i} ${wx(c.d).h}°</div>`:''}</div>`).join('')}</div>`;
  let all=`<div class="allrow" style="grid-template-columns:34px repeat(${cols.length},1fr)"><span class="small muted" style="padding-top:2px">dia</span>${cols.map(c=>{
    const d=c.d||days[0];let its=occ(d).filter(o=>o.ad);if(colKey)its=its.filter(o=>c.key==='fam'?!o.e.p.length:o.e.p.includes(c.key));
    const ts=enc==='B'||days.length===1?[]:tasksOn(d).filter(t=>!colKey||(c.key==='fam'?!t.p.length:t.p.includes(c.key)));
    const hn=!colKey&&holi(d);return `<div class="${!colKey&&dcls(d)?dcls(d)+'cell':''}" style="display:flex;flex-direction:column;gap:2px;min-width:0">${hn?`<span class="chip hdchip" title="${H[d]}">${H[d]}</span>`:''}${its.map(o=>enc==='C'?itemC(o,colKey?c.key:null):`<button class="chip ${o.e.imp}" data-e="${o.e.id}" style="background:${tint(T[o.e.ty].c,25)}">${T[o.e.ty].i} ${title(o)}</button>`).join('')}${ts.map(t=>`<button class="chip" data-t="${t.id}" style="border:1px dashed var(--line);${t.done?'text-decoration:line-through;':''}">${ic(t.done?'check':'square',12)} ${t.t}</button>`).join('')}</div>`;}).join('')}</div>`;
  let body=`<div class="tg" style="grid-template-columns:34px repeat(${cols.length},1fr);height:${hgt}px"><div class="hours">${Array.from({length:to-from},(_,i)=>`<div class="hr tnum" style="top:${i*px}px">${from+i}</div>`).join('')}</div>`;
  for(const c of cols){
    const d=c.d||days[0];let its=occ(d).filter(o=>!o.ad);if(colKey)its=its.filter(o=>c.key==='fam'?!o.e.p.length:o.e.p.includes(c.key));
    lanesOf(its);
    body+=`<div class="col ${colKey?'':dcls(d)}">${Array.from({length:to-from},(_,i)=>`<div class="hr" style="top:${i*px}px"></div>`).join('')}`;
    for(const o of its){const s=Math.max(mins(o.s),from*60),e=o.en?mins(o.en):s+30;const top=(s-from*60)/60*px,h=Math.max((e-s)/60*px,16);
      const col=enc==='C'?(colKey?(c.key==='fam'?FAMC:P[c.key].c):pcols(o.e)[0]):T[o.e.ty].c;
      body+=`<button class="ev ${o.e.imp} ${o.en?'':'moment'}" data-e="${o.e.id}" style="top:${top}px;height:${h}px;left:calc(${o.k*100/o.n}% + 2px);width:calc(${100/o.n}% - 4px);right:auto;background:${tint(col,28)};border-left:3px solid ${col}"><b class="tnum">${o.s}</b> ${T[o.e.ty].i} ${o.e.t}${enc==='B'&&o.e.p.length?' · '+o.e.p.map(x=>P[x].n[0]).join(''):''}</button>`;}
    if(d===TODAY){body+=`<div class="now" style="top:${(mins(NOW)-from*60)/60*px}px"></div>`;}
    body+='</div>';
  }
  body+='</div>';
  return (days.length===1&&!colKey?'':head)+all+body; // single-day grid: the date is already in the header
}


// Year planner: one row per month, weekdays aligned in columns (Monday first), like a wall planner
function yearAligned(){
  const y=yr(st.cur);const N=37;
  let h=`<div style="overflow-x:auto;padding:8px 0 0"><table class="yp tnum"><thead><tr><th class="ml"></th>${Array.from({length:N},(_,i)=>`<th class="${i%7<2?'we':''}">${['S','D','2ª','3ª','4ª','5ª','6ª'][i%7]}</th>`).join('')}</tr></thead><tbody>`;
  for(let m=0;m<12;m++){
    const first=`${y}-${String(m+1).padStart(2,'0')}-01`;const off=(wd(first)+2)%7; // column 0 is always a Saturday
    h+=`<tr><th class="ml"><button data-month="${first}">${MN[m].slice(0,3)}</button></th>`;
    for(let i=0;i<N;i++){
      const dnr=i-off+1;const s=`${y}-${String(m+1).padStart(2,'0')}-${String(dnr).padStart(2,'0')}`;
      if(dnr<1||S(D(s))!==s){h+=`<td class="${i%7<2?'we':''} void"></td>`;continue;}
      const its=occ(s);const hi=its.find(o=>o.e.imp==='high');const any=its.some(o=>!o.rep&&o.e.imp!=='low');
      const cls=[i%7<2?'we':'',holi(s)?'hd':'',s===TODAY?'td':''].join(' ');
      const bg=hi?`background:${T[hi.e.ty].c};color:#fff`:'';
      h+=`<td class="${cls}"><button data-daygo="${s}" title="${[holi(s)||'',...its.filter(o=>!o.rep).map(o=>o.e.t)].filter(Boolean).join(' · ')}" style="${bg}">${dnr}${any&&!hi?'<i></i>':''}</button></td>`;
    }
    h+='</tr>';
  }
  h+=`</tbody></table></div><p class="small muted" style="padding:6px 16px">37 colunas fixas, sempre de sábado a domingo: a grelha é igual todos os anos e só os dias mudam de lugar. Cor cheia = entrada de importância alta, na cor do seu tipo. Ponto = outras entradas. Laranja = feriado. Deslize para os lados; toque num dia para abrir o mês.</p>`;
  return h+yearMinis().split('<h2')[1].replace(/^/,'<h2');
}

// ---------- sheets ----------
function sheets(){
  let h='';
  if(st.sheet==='filter'){
    h=`<div class="sheetwrap" data-close><div class="sheet" role="dialog" aria-label="Filtro de Pessoas"><h2>Mostrar</h2><div class="row">${PIDS.map(p=>`<button class="pchip" aria-pressed="${st.sel.has(p)}" data-person="${p}"><span class="av" style="background:${P[p].c}">${P[p].n[0]}</span>${P[p].n}</button>`).join('')}</div>
      <p class="small muted">Nenhuma selecionada = todas.</p>
      <button class="switch" data-toggle="fam"><span>Entradas da Família (sem Pessoa)</span><span class="knob ${st.fam?'on':''}"></span></button>
      <button class="switch" data-toggle="hol"><span>Feriados</span><span class="knob ${st.hol?'on':''}"></span></button>
      <button class="btn" data-close>Fechar</button></div></div>`;
  }else if(st.sheet&&st.sheet.e){
    const e=E.find(x=>x.id===st.sheet.e);
    const when=e.from?(e.rep?`todos os anos a ${dnum(e.from)} de ${MN[mon(e.from)]}`:e.from===e.to?long(e.from)+' · dia todo':`${long(e.from)} → ${long(e.to)} (inclusive)`):(e.rep?`${e.start.slice(11)}${e.end?'–'+e.end.slice(11):''} · repete ${e.rep.d?'todos os dias':'às '+e.rep.w.map(i=>WDL[i]+'s').join(', ')}`:`${long(e.start.slice(0,10))} ${e.start.slice(11)}${e.end?' → '+(e.end.slice(0,10)!==e.start.slice(0,10)?long(e.end.slice(0,10))+' ':'')+e.end.slice(11):' (sem hora de fim)'}`);
    const d=e.start?e.start.slice(0,10):e.from;const w=wx(d);
    h=`<div class="sheetwrap" data-close><div class="sheet" role="dialog" aria-label="Entrada"><h2>${T[e.ty].i} ${e.t}</h2><dl class="kv"><dt>Quando</dt><dd>${when}</dd><dt>Para</dt><dd>${e.p.length?e.p.map(x=>P[x].n).join(', '):'Família'}</dd><dt>Tipo</dt><dd>${T[e.ty].n}</dd><dt>Importância</dt><dd>${{low:'baixa',normal:'normal',high:'alta'}[e.imp]}</dd>${w?`<dt>Tempo</dt><dd><span data-wx role="button" tabindex="0" class="tnum" style="text-decoration:underline dotted">${w.i} ${w.h}°/${w.l}°</span></dd>`:''}<dt>Lembrete</dt><dd>${e.ty==='appt'?'1 dia antes, 1 hora antes':e.ty==='bday'?'3 dias antes, no dia 09:00':'—'}</dd></dl>
      ${st.v===3?'<p class="small muted">Display Mode: só leitura.</p>':'<div class="row"><button class="btn" data-close style="flex:1">Editar</button><button class="btn" data-close style="flex:1;background:var(--weekend);color:var(--ink)">Fechar</button></div>'}</div></div>`;
  }
  if(st.sheet==='wx'){
    h=`<div class="sheetwrap center" data-close><div class="sheet" role="dialog" aria-label="Abrir previsão do tempo"><h2>Abrir a previsão do tempo?</h2><p style="margin:0">Vai sair da app e abrir o site do IPMA com a previsão para Lisboa, num novo separador.</p>
      <div class="row"><button class="btn" data-close style="flex:1;background:var(--weekend);color:var(--ink)">Cancelar</button><a class="btn" data-close href="https://www.ipma.pt/pt/otempo/prev.localidade.hora/" target="_blank" rel="noopener" style="flex:1;text-decoration:none">Abrir IPMA ↗</a></div></div></div>`;
  }
  if(st.toast)h+=`<div class="toast" role="status">${st.toast}</div>`;
  return h;
}

// ---------- render + events ----------
const app=document.getElementById('app');
function render(){
  const f=[renderA,renderB,renderC,renderD][st.v];
  if(st.v===1&&!st.pick)st.pick=TODAY;
  if(st.v===1&&st.view==='day'&&!st._bday)st._bday=1;
  app.innerHTML=f();
  document.getElementById('vlabel').textContent=`${V[st.v].k} · ${V[st.v].name}`;
  try{localStorage.setItem('fcv',JSON.stringify({view:st.view}));}catch(e){}
}
function setV(i){st.v=(i+V.length)%V.length;st.sheet=null;try{history.replaceState(null,'','#'+V[st.v].k.toLowerCase());}catch(e){}render();}
document.getElementById('prev').onclick=()=>setV(st.v-1);
document.getElementById('next').onclick=()=>setV(st.v+1);
document.addEventListener('keydown',e=>{if(e.target.closest('input,textarea,select,[contenteditable]'))return;if(e.key==='ArrowLeft')setV(st.v-1);if(e.key==='ArrowRight')setV(st.v+1);if(e.key==='Escape'&&st.sheet){st.sheet=null;render();}if((e.key==='Enter'||e.key===' ')&&e.target.matches&&e.target.matches('[data-wx]')){e.preventDefault();st.sheet='wx';render();}});
function toast(m){st.toast=m;render();setTimeout(()=>{st.toast=null;render();},1800);}
app.addEventListener('change',e=>{if(e.target.matches('[data-select]')){st.view=e.target.value;render();}});
app.addEventListener('click',e=>{
  if(e.target.closest('a[href]')){st.sheet=null;setTimeout(render,0);return;}
  const w=e.target.closest('[data-wx]');if(w){e.stopPropagation();st.sheet='wx';return render();}
  const b=e.target.closest('button,[data-close]');if(!b)return;
  if(b.matches('.sheetwrap')&&e.target!==b)return;
  const ds=b.dataset;
  if('close' in ds){st.sheet=null;return render();}
  if(ds.view){st.view=ds.view;return render();}
  if(ds.nav){const n=+ds.nav,v=st.view;st.cur=v==='day'?add(st.cur,n):v==='week'?add(st.cur,7*n):v==='month'?addMonth(st.cur,n):`${yr(st.cur)+n}-01-01`;if(st.v===1&&v==='month')st.pick=st.cur;return render();}
  if(ds.go==='today'){st.cur=TODAY;st.pick=TODAY;return render();}
  if(ds.go==='tasks'){st.view='tasks';return render();}
  if(ds.day){st.cur=ds.day;st.view='day';return render();}
  if(ds.daygo){st.cur=ds.daygo;st.pick=ds.daygo;st.view='month';return render();}
  if(ds.pick){st.pick=ds.pick;return render();}
  if(ds.month){st.cur=ds.month;st.pick=ds.month;st.view='month';return render();}
  if(ds.sheet){st.sheet=ds.sheet;return render();}
  if(ds.person){st.sel.has(ds.person)?st.sel.delete(ds.person):st.sel.add(ds.person);return render();}
  if(ds.lane){if(ds.lane==='fam')st.fam=!st.fam;else{if(!st.sel.size){PIDS.forEach(p=>st.sel.add(p));}st.sel.has(ds.lane)?st.sel.delete(ds.lane):st.sel.add(ds.lane);if(st.sel.size===PIDS.length)st.sel.clear();}return render();}
  if(ds.toggle){st[ds.toggle]=!st[ds.toggle];return render();}
  if(ds.e){st.sheet={e:+ds.e};return render();}
  if(ds.t){const t=TK.find(x=>x.id===+ds.t);t.done=!t.done;return toast(t.done?`Feita: ${t.t}`:`Por fazer: ${t.t}`);}
  if('voice' in ds)return toast('Voice Entry: "Dentista da Ana terça às 15h. Guardo?"');
  if('new' in ds)return toast('Aqui abre o formulário de nova entrada');
});
render();
</script>
